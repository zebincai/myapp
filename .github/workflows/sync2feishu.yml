name: Sync Docs to Feishu Wiki

on:
  push:
    branches: [main, master]
    paths:
      - "docs/**"
      - "**/*.md"
      - ".feishuignore"

  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    env:
      FEISHU_WIKI_SPACE_ID: ${{ secrets.FEISHU_WIKI_SPACE_ID }}
      FEISHU_WIKI_NODE_TOKEN: ${{ secrets.FEISHU_WIKI_NODE_TOKEN }}
      FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
      FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Install lark-cli
        run: |
          npx @larksuite/cli@latest install

      - name: Get Feishu Access Token
        run: |
          echo ${FEISHU_APP_SECRET} | lark-cli config init \
            --app-id ${FEISHU_APP_ID} \
            --app-secret-stdin \
            --brand feishu

      - name: Run sync
        run: |
          chmod +x ./sync-docs.sh
          ./sync-docs.sh